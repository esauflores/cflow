<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CFlow</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // The saved theme ("system" by default, following the OS), applied before the first paint so it never flashes.
      try {
        const choice = localStorage.getItem("cflow.theme");
        const dark =
          choice === "light" ? false : choice === "dark" ? true : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch {
        document.documentElement.classList.toggle("dark", matchMedia("(prefers-color-scheme: dark)").matches);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
