[tools]
bun = "1.4"

[tasks.check]
description = "vp check: format, lint and type-check the API, the web app and the server"
run = "bun run check"

[tasks.check-fix]
run = "bun run check:fix"

[tasks.test]
run = "bun run test"

[tasks.dev]
description = "Run the API and the web app together, with reload"
run = "bun run dev"

[tasks.build]
description = "Bundle the server, the API and the web app into server/dist"
run = "bun run build"

[tasks.start]
description = "Build, then serve CFlow in production mode (one port)"
run = "bun run start"

[tasks.db-generate]
description = "Write a migration for the tables changed since the last one"
run = "bun run db:generate"
