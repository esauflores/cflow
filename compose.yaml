# docker compose up -d   →   http://localhost:8080
# Variables are plain values; change them here. The database is the `cflow-data` volume at /data, so back it
# up by copying /data/cflow.db.
services:
  cflow:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_TIMEZONE: UTC
      SESSION_TTL_DAYS: "30"
      ALLOW_GUEST: "false"
      CFLOW_PLUGINS: core
    volumes:
      - cflow-data:/data
    healthcheck:
      test: bun -e "if (!(await fetch('http://localhost:8080/health')).ok) process.exit(1)"
      interval: 30s
      timeout: 3s
      start_period: 10s

volumes:
  cflow-data:
