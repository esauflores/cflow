# docker compose up -d   →   http://localhost:8080
# Variables are plain values; change them here. The database is the `cflow-data` volume at /data, so back it
# up by copying /data/cflow.db.
services:
  cflow:
    build: .
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      PORT: 3000
      DATABASE_PATH: /data/cflow.db
      APP_TIMEZONE: UTC
      SESSION_TTL_DAYS: "30"
      DEMO_MODE: "false"
      CFLOW_PLUGINS: core,i18n
    volumes:
      - cflow-data:/data
    healthcheck:
      test: bun -e "if (!(await fetch('http://127.0.0.1:3000/api/health')).ok) process.exit(1)"
      interval: 30s
      timeout: 3s
      start_period: 10s

volumes:
  cflow-data:
