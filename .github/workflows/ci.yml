name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node and Bun at the versions in mise.toml; the tasks below are the same ones run locally.
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: mise run check
      - run: mise run test
      - run: mise run build
